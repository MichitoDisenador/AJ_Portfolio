/* ============================================================
   Hooks auxiliares
   ============================================================ */
function useInView(threshold) {
  const th = threshold === undefined ? 0.15 : threshold;
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(function () {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          setInView(true);
          obs.disconnect();
        }
      });
    }, { threshold: th, rootMargin: '-80px' });
    obs.observe(el);
    return function () { obs.disconnect(); };
  }, [th]);
  return [ref, inView];
}

/* ============================================================
   SafeImage — muestra marcador si la imagen no carga
   ============================================================ */
function SafeImage({ src, alt, className, style, decorative }) {
  const [failed, setFailed] = useState(false);
  if (!src) return null;
  if (failed && decorative) return null;
  if (failed) {
    return <div className={className} style={Object.assign({}, style, { backgroundColor: 'oklch(0.18 0 0)' })} aria-hidden="true" />;
  }
  return (
    <img
      src={src}
      alt={decorative ? '' : (alt || '')}
      className={className}
      style={style}
      onError={function () { setFailed(true); }}
      aria-hidden={decorative ? 'true' : undefined}
    />
  );
}

/* ============================================================
   BrandLogo
   ============================================================ */
function BrandLogo({ className }) {

      {BRAND}
    </span>
  );
}

/* ============================================================
   StarField
   ============================================================ */
function rand(a, b) { return a + Math.random() * (b - a); }
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function StarField(props) {
  const count = props.count || 600;
  const ring = props.ring || false;
  const ringCount = props.ringCount || 240;
  const ringRadiusFactor = props.ringRadiusFactor || 0.36;
  const ringBandWidth = props.ringBandWidth || 52;

  const canvasRef = useRef(null);
  const starsRef = useRef([]);
  const rafRef = useRef(0);
  const sizeRef = useRef({ w: 0, h: 0 });

  useEffect(function () {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const parent = canvas.parentElement;
    if (!parent) return;

    const build = function (w, h) {
      const stars = [];
      for (let i = 0; i < count; i++) {
        const p = Math.random();
        let r;
        if (p < 0.65) r = rand(0.25, 0.50);
        else if (p < 0.92) r = rand(0.50, 0.80);
        else r = rand(0.80, 1.30);
        stars.push({
          x: Math.random() * w, y: Math.random() * h, r: r,
          opacity: rand(0.2, 0.95),
          twinkleSpeed: rand(0.4, 1.6),
          twinkleOffset: Math.random() * Math.PI * 2,
          radiusOffset: 0, isRing: false,
        });
      }
      if (ring) {
        const cx = w / 2, cy = h / 2;
        const ringR = Math.min(w, h) * ringRadiusFactor;
        const half = ringBandWidth / 2;
        for (let i = 0; i < ringCount * 2; i++) {
          const angle = Math.random() * Math.PI * 2;
          const offset = gauss() * half * 0.65;
          const dist = ringR + offset;
          const x = cx + Math.cos(angle) * dist;
          const y = cy + Math.sin(angle) * dist;
          const p = Math.random();
          let r;
          if (p < 0.70) r = rand(0.15, 0.30);
          else if (p < 0.93) r = rand(0.30, 0.50);
          else r = rand(0.50, 0.70);
          stars.push({
            x: x, y: y, r: r,
            opacity: rand(0.25, 0.80),
            twinkleSpeed: rand(0.3, 1.3),
            twinkleOffset: Math.random() * Math.PI * 2,
            radiusOffset: offset, isRing: true,
          });
        }
      }
      starsRef.current = stars;
    };

    const resize = function () {
      const rect = parent.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      sizeRef.current = { w: rect.width, h: rect.height };
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      const ctx = canvas.getContext('2d');
      if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build(rect.width, rect.height);
    };

    const ro = new ResizeObserver(resize);
    ro.observe(parent);
    resize();

    const draw = function (t) {
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const s = sizeRef.current;
      const w = s.w, h = s.h;
      ctx.clearRect(0, 0, w, h);

      const stars = starsRef.current;
      const ringR = Math.min(w, h) * ringRadiusFactor;

      if (ring && w > 0 && h > 0) {
        const inner = Math.max(0, ringR - ringBandWidth * 4);
        const outer = ringR + ringBandWidth * 4;
        if (outer > 0) {
          const grad = ctx.createRadialGradient(w / 2, h / 2, inner, w / 2, h / 2, outer);
          grad.addColorStop(0, 'rgba(255,255,255,0.022)');
          grad.addColorStop(0.5, 'rgba(255,255,255,0.038)');
          grad.addColorStop(0.58, 'rgba(255,255,255,0.022)');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }
      }

      for (let i = 0; i < stars.length; i++) {
        const st = stars[i];
        const tw = 0.5 + 0.5 * Math.sin(t * st.twinkleSpeed + st.twinkleOffset);
        let alpha = st.opacity * (0.55 + 0.45 * tw);
        if (st.isRing) {
          const att = Math.max(0.15, 1 - Math.abs(st.radiusOffset) / (ringBandWidth * 0.65));
          alpha *= att;
        }
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.fill();

        const glowThreshold = st.isRing ? 1.0 : 1.1;
        if (st.r > glowThreshold) {
          const glowR = st.isRing ? st.r * 5 : st.r * 4;
          const g = ctx.createRadialGradient(st.x, st.y, 0, st.x, st.y, glowR);
          const a = st.isRing ? alpha * 0.4 : alpha * 0.3;
          g.addColorStop(0, 'rgba(255,255,255,' + a + ')');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(st.x, st.y, glowR, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);

    return function () {
      cancelAnimationFrame(rafRef.current);
      ro.disconnect();
    };
  }, [count, ring, ringCount, ringRadiusFactor, ringBandWidth]);

  return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none" style={{ zIndex: 0 }} aria-hidden="true" />;
}

/* ============================================================
   LineField
   ============================================================ */
const LINES = {
  hero: [[0,0,22,100],[50,0,82,100],[100,0,58,100],[0,35,100,80],[100,10,0,70],[30,0,100,55]],
  photographer: [[22,0,14,100],[58,0,48,100],[82,0,86,100],[0,20,100,90],[100,15,0,80]],

  const lines = LINES[v];
  const opacity = v === 'marvelsBottom' ? 0.22 : 0.1;
  return (
    <svg
      className="absolute inset-0 pointer-events-none select-none w-full h-full"

            key={i}

            strokeWidth="0.08"
            strokeOpacity={opacity}
          />
        );
      })}

/* ============================================================
   IntroSequence
   ============================================================ */
function IntroSequence({ onDone }) {
  const [hidden, setHidden] = useState(false);
  const [phase, setPhase] = useState(0);

  useEffect(function () {
    const t1 = setTimeout(function () { setPhase(1); }, 200);
    const t2 = setTimeout(function () { setPhase(2); }, 1200);
    const t3 = setTimeout(function () { setPhase(3); }, 2800);
    const t4 = setTimeout(function () {
      setHidden(true);
      if (onDone) onDone();
    }, 3600);
    return function () { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); };
  }, [onDone]);

  if (hidden) return null;

  const fadeBg = phase >= 3;

  return (
    <div className="fixed inset-0 z-[100] pointer-events-none">
      <div
        className="absolute inset-0 transition-opacity duration-[800ms]"
        style={{ backgroundColor: 'oklch(0.16 0.004 240)', opacity: fadeBg ? 0 : 1 }}
      />
      {[1, 2, 3].map(function (n) {
        const size = 260 * n;
        const visible = phase >= 1 && phase < 3;
        return (
          <div
            key={n}
            className="absolute left-1/2 top-1/2 rounded-full border border-white/10 transition-all duration-[2400ms] ease-out"
            style={{
              width: size, height: size,
              marginLeft: -size / 2, marginTop: -size / 2,
              opacity: visible ? 0.55 : 0,
              transform: phase >= 2 ? 'scale(1.4)' : (phase >= 1 ? 'scale(1)' : 'scale(0.15)'),
              transitionDelay: ((n - 1) * 120) + 'ms',
            }}
          />
        );
      })}
      <div
        className="absolute transition-all duration-[800ms]"
        style={{
          top: phase >= 3 ? '24px' : '50%',
          left: phase >= 3 ? '24px' : '50%',
          transform: phase >= 3 ? 'scale(0.42)' : 'translate(-50%, -50%) scale(1)',
          transformOrigin: phase >= 3 ? 'top left' : 'center',
          transitionTimingFunction: 'cubic-bezier(0.22,1,0.36,1)',
        }}
      >
        <div className="relative h-16 flex items-center">
          <div
            className="absolute rounded-full bg-white transition-all"
            style={{
              left: 32, top: 32, marginLeft: -4, marginTop: -4, zIndex: 2,
              width: phase >= 2 ? 64 : (phase >= 1 ? 10 : 8),
              height: phase >= 2 ? 64 : (phase >= 1 ? 10 : 8),
              opacity: phase >= 2 ? 0 : 1,
              transitionDuration: phase >= 2 ? '1200ms' : '400ms',
              transitionTimingFunction: 'cubic-bezier(0.22,1,0.36,1)',
            }}
          />
          <div
            className="overflow-hidden h-16 transition-all duration-[1200ms]"
            style={{
              width: phase >= 3 ? 300 : 64,
              transitionTimingFunction: 'cubic-bezier(0.22,1,0.36,1)',
            }}
          >
            <div className="h-16 flex items-center font-display font-black text-white text-[40px] leading-none whitespace-nowrap pl-2">
              {BRAND}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function TopBar() {
  const [open, setOpen] = useState(false);
  const [barReady, setBarReady] = useState(false);

  useEffect(function () {
    const t = setTimeout(function () { setBarReady(true); }, 2700);
    return function () { clearTimeout(t); };
  }, []);

  return (
    <header className="fixed top-0 left-0 right-0 z-50 pt-6 px-6 md:px-10">
      <div className="flex items-center justify-between gap-4">
        <a href="#hero" className="shrink-0 transition-opacity duration-500" style={{ opacity: barReady ? 1 : 0 }}>
          <BrandLogo className="text-2xl" />
        </a>

        <nav className="hidden md:flex items-center gap-2">
          {NAV_LINKS.map(function (link) {
            return (
              <a
                key={link.href}
                href={link.href}
                className="rounded-full border border-white/15 px-4 py-2 text-xs uppercase tracking-widest text-white/60 hover:text-white hover:bg-white/[0.06] transition"
              >
                {link.label}
              </a>
            );
          })}
        </nav>

        <button
          onClick={function () { setOpen(!open); }}
          aria-label="Menú"
          className="md:hidden grid place-items-center w-10 h-10 rounded-full border border-white/15 text-white/70 hover:text-white hover:bg-white/[0.06] transition"
        >
          {open ? <IconClose className="w-4 h-4" /> : <IconMenu className="w-4 h-4" />}
        </button>
      </div>

      <div
        className="md:hidden mt-3 ml-auto max-w-sm rounded-2xl border border-white/10 bg-black/60 backdrop-blur-xl overflow-hidden transition-all duration-300"
        style={{
          opacity: open ? 1 : 0,
          transform: open ? 'translateY(0)' : 'translateY(-8px)',
          pointerEvents: open ? 'auto' : 'none',
        }}
      >
        <nav className="flex flex-col p-2">
          {NAV_LINKS.map(function (link) {
            return (
              <a
                key={link.href}
                href={link.href}
                onClick={function () { setOpen(false); }}
                className="px-4 py-3 rounded-xl text-sm text-white/80 hover:text-white hover:bg-white/[0.06] transition"
              >
                {link.label}
              </a>
            );
          })}
        </nav>
        <div className="mt-1 px-4 py-3 border-t border-white/10 flex items-center justify-between text-xs text-white/50">
          <span>Síguenos</span>
          <div className="flex items-center gap-3 text-white/60">
            {SOCIALS.map(function (s) {
              return (
                <a key={s.name} href={s.url} target="_blank" rel="noopener noreferrer" aria-label={s.name} className="hover:text-white transition">
                  <SocialIcon name={s.icon} className="w-4 h-4" />
                </a>
              );
            })}
          </div>
        </div>
      </div>
    </header>
  );
}

/* ============================================================
   Reveal
   ============================================================ */
function Reveal({ children, delay, className, photo }) {
  const [ref, inView] = useInView();
  const d = delay || 0;
  const base = photo ? 'anim-hidden-photo' : 'anim-hidden';
  const shown = photo ? 'anim-shown-photo' : 'anim-shown';
  return (
    <div
      ref={ref}
      className={(className || '') + ' ' + (inView ? shown : base)}
      style={{ transitionDelay: (inView ? d : 0) + 'ms' }}
    >
      {children}
    </div>
  );
}

/* ============================================================
   Hero
   ============================================================ */
const HERO_CARDS = [
  { src: ASSETS.hero1, alt: 'Torito — TikTok',       pos: 'top-[2%] left-[34%]',  size: 'w-[150px] aspect-[4/3]',  depth: 18 },
  { src: ASSETS.hero2, alt: 'Tambor',                pos: 'top-[2%] right-[2%]',  size: 'w-[260px] aspect-[16/9]', depth: 22 },
  { src: ASSETS.hero3, alt: 'Pastel — Instagram',    pos: 'top-[7%] left-[4%]',   size: 'w-[110px] aspect-[3/4]',  depth: 28 },
  { src: ASSETS.hero4, alt: 'Boda',                  pos: 'top-[10%] right-[12%]',size: 'w-[200px] aspect-[3/4]',  depth: 26, viewAlbum: true },
  { src: ASSETS.hero5, alt: 'Tulipán — Facebook',    pos: 'top-[18%] left-[3%]',  size: 'w-[220px] aspect-[3/4]',  depth: 20 },
  { src: ASSETS.hero6, alt: 'Quinceañera',           pos: 'bottom-[6%] left-[30%]', size: 'w-[160px] aspect-[4/5]', depth: 24 },

];

function Hero() {
  const ref = useRef(null);

  useEffect(function () {
    const el = ref.current;
    if (!el) return;
    const onMove = function (e) {
      const mx = e.clientX / window.innerWidth - 0.5;
      const my = e.clientY / window.innerHeight - 0.5;
      el.style.setProperty('--mx', String(mx));
      el.style.setProperty('--my', String(my));
    };
    window.addEventListener('mousemove', onMove);
    return function () { window.removeEventListener('mousemove', onMove); };
  }, []);

  return (
    <section
      ref={ref}
      id="hero"
      className="matte relative min-h-[110vh] pt-32 pb-24 overflow-hidden"
      style={{ '--mx': 0, '--my': 0 }}
    >
      <StarField count={700} />
      <LineField variant="hero" />
      <div className="absolute -top-40 left-1/2 -translate-x-1/2 w-[800px] h-[800px] rounded-full bg-white/[0.04] blur-3xl pointer-events-none" style={{ zIndex: 1 }} />

      <div className="relative grid place-items-center min-h-[80vh] px-6 text-center" style={{ zIndex: 10 }}>
        <div className="max-w-3xl w-full flex flex-col items-center">
          {ASSETS.logo ? (
            <img src={ASSETS.logo} alt={BRAND} className="w-full max-w-[600px] md:max-w-[800px] h-auto object-contain" />
          ) : (
            <h1 className="font-display font-black text-6xl sm:text-7xl md:text-[110px] leading-[0.95] tracking-tight">
              {BRAND}
            </h1>
          )}
          <p className="mt-10 text-white/55 text-base md:text-[15px] leading-relaxed max-w-md mx-auto">
            Creamos experiencias visuales que cautivan e inspiran. Elevamos tu marca a través del arte y la innovación digital.
          </p>
        </div>
      </div>

      <div className="absolute inset-0 pointer-events-none" style={{ zIndex: 20 }}>
        {HERO_CARDS.map(function (c, i) {
          if (!c.src) return null;
          return (
            <div
              key={i}
              className={'absolute ' + c.pos + ' ' + c.size + ' pointer-events-auto'}
              style={{
                transform: 'translate3d(calc(var(--mx) * ' + c.depth + 'px), calc(var(--my) * ' + c.depth + 'px), 0)',
                transition: 'transform 0.4s cubic-bezier(0.22,1,0.36,1)',
              }}
            >
              <div className="group relative w-full h-full overflow-hidden ring-1 ring-white/10" style={{ boxShadow: '0 30px 80px -30px rgba(0,0,0,0.9)' }}>
                <SafeImage src={c.src} alt={c.alt} className="w-full h-full object-cover transition-transform duration-[1200ms] group-hover:scale-105" />
                {c.viewAlbum && (
                  <a href={'mailto:' + EMAIL} className="absolute left-4 bottom-5 flex items-center gap-2.5">
                    <div className="relative grid place-items-center">
                      <div className="absolute w-[55px] h-[55px] rounded-full bg-white/30 blur-[10px]" />
                      <div className="absolute w-[38px] h-[38px] rounded-full bg-white/50 blur-[4px]" />
                      <div className="w-[25px] h-[25px] rounded-full bg-white" style={{ boxShadow: '0 0 18px 4px rgba(255,255,255,0.7)' }} />
                    </div>
                    <div className="grid place-items-center rounded-full bg-black/35 backdrop-blur-md text-white text-[13px] border border-white/15" style={{ width: 119, height: 39 }}>
                      Ver álbum
                    </div>
                  </a>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

/* ============================================================
   ContactSection
   ============================================================ */
function ContactSection() {
  const sectionRef = useRef(null);
  const bgRef = useRef(null);

  useEffect(function () {
    const onScroll = function () {
      const section = sectionRef.current;
      const bg = bgRef.current;
      if (!section || !bg) return;
      const rect = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const total = rect.height + vh;
      const passed = vh - rect.top;
      const progress = Math.max(0, Math.min(1, passed / total));
      bg.style.transform = 'translateY(' + (-15 * progress) + '%)';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return function () { window.removeEventListener('scroll', onScroll); };
  }, []);

  return (
    <section ref={sectionRef} id="contacto" className="relative">
      <div className="relative px-6 md:px-12 pt-28 pb-12 overflow-hidden">
        <StarField count={450} />
        <LineField variant="marvels" />
        <div className="relative" style={{ zIndex: 2 }}>
          <Reveal>
            <h2 className="font-display font-medium uppercase text-4xl sm:text-5xl md:text-[90px] leading-[0.95] tracking-tight max-w-[1200px]">
              Hablemos de tu próximo proyecto visual
            </h2>
          </Reveal>
          <div className="flex flex-wrap gap-4 justify-between items-center mt-16 text-xs uppercase tracking-widest text-white/50">
            <a href="#portafolio" className="group inline-flex items-center gap-2 hover:text-white transition">
              Ver las obras <IconMoveRight className="w-3.5 h-3.5 transition group-hover:translate-x-1" style={{ transform: 'rotate(-45deg)' }} />
            </a>
            <a href="#hero" className="group inline-flex items-center gap-2 hover:text-white transition">
              Volver arriba <IconMoveRight className="w-3.5 h-3.5 transition group-hover:translate-y-1" style={{ transform: 'rotate(-90deg)' }} />
            </a>
          </div>
        </div>
      </div>

      <div className="relative min-h-[80vh] overflow-hidden">
        <div ref={bgRef} className="absolute inset-0 -top-[10%] -bottom-[10%]" style={{ willChange: 'transform' }}>
          <SafeImage src={ASSETS.contactBg} alt="" decorative className="w-full h-full object-cover" />
        </div>
        <div className="absolute inset-0 bg-gradient-to-t from-black/50 via-black/20 to-black/40" />
        <LineField variant="marvelsBottom" />
        <div className="relative h-full grid place-items-center px-6 py-20 text-center">
          <div className="max-w-3xl">
            <Reveal>
              <h3 className="font-display font-black uppercase text-4xl md:text-6xl leading-[1] tracking-tight">
                Ponte en contacto con <span className="text-lime">{BRAND}</span>
              </h3>
            </Reveal>

            <Reveal delay={150}>
              <p className="mt-6 text-white/70 text-[15px] leading-relaxed max-w-xl mx-auto">
                ¿Tienes una idea, un proyecto o una sesión en mente? Escríbeme y hagámoslo realidad.
              </p>
              <a
                href={'mailto:' + EMAIL}
                className="mt-3 inline-block text-white hover:text-lime text-sm md:text-base underline underline-offset-4 decoration-white/40 hover:decoration-white transition"
              >
                {EMAIL}
              </a>
            </Reveal>

            <div className="flex items-center justify-center gap-1">
              <Reveal delay={300}>
                <a
                  href={'mailto:' + EMAIL}
                  className="mt-10 inline-flex bg-white text-black rounded-full px-6 py-2 text-sm font-medium hover:bg-white/90 uppercase transition"
                >
                  CONTÁCTANOS
                </a>
              </Reveal>
            </div>

            <Reveal delay={450}>
              <div className="mt-14">
                <p className="text-white/50 text-[11px] uppercase tracking-[0.3em] mb-5">
                  Sígueme en redes
                </p>
                <div className="flex items-center justify-center gap-3 flex-wrap">
                  {SOCIALS.map(function (s) {
                    return (
                      <a
                        key={s.name}
                        href={s.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label={s.name}
                        className="group flex items-center gap-2 rounded-full border border-white/20 bg-black/40 backdrop-blur-sm px-4 py-2 text-xs uppercase tracking-widest text-white/80 hover:text-white hover:bg-white/[0.12] hover:border-white/40 transition"
                      >
                        <SocialIcon name={s.icon} className="w-4 h-4" />
                        <span>{s.name}</span>
                      </a>
                    );
                  })}
                </div>
              </div>
            </Reveal>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   Footer

function Footer() {
  return (

/* ============================================================
   App
   ============================================================ */
function AJDigitalArtLanding() {
  const [introDone, setIntroDone] = useState(false);
  return (
    <React.Fragment>
      {!introDone && <IntroSequence onDone={function () { setIntroDone(true); }} />}
      <TopBar />
      <main>
        <Hero />
        <AboutMe />
        <Portfolio />
        <ContactSection />
        <Footer />
      </main>
    </React.Fragment>
  );
}

try {
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<AJDigitalArtLanding />);
} catch (err) {
  var el = document.getElementById('boot-error');
  if (el) {
    el.style.display = 'block';
    el.textContent = 'Error al renderizar: ' + err.message + '\n\n' + err.stack;
  }
}
</script>
