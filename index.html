const ALL_GALLERY_KEYS = ['bodas', 'quinceycumpleanos', 'sesiones', 'comerciales', 'premiados', 'digitalart', 'deportesyespectaculos'];
let mixCache = [];

function getMixedGallery() {
  if (mixCache.length > 0) return mixCache;
  
  let allPhotos = [];
  ALL_GALLERY_KEYS.forEach(function(key) {
    const photos = GALLERIES[key] || [];
    allPhotos = allPhotos.concat(photos);
  });
  
  // Mezclar al azar (Algoritmo Fisher-Yates)
  for (let i = allPhotos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = allPhotos[i];
    allPhotos[i] = allPhotos[j];
    allPhotos[j] = temp;
  }
  
  // Tomar solo 40 fotos al azar para no saturar (puedes cambiar el 40)
  mixCache = allPhotos.slice(0, 40);
  return mixCache;
}

/* ============ HOOK ============ */
function useInView(threshold) {
  const th = threshold === undefined ? 0.15 : threshold;
  const ref = useRef(null);
  const [inView, setInView] = useState(false);

  useEffect(function () {
    const el = ref.current;
    if (!el) return;
    let cancelled = false;

    const trigger = function () {
      // 2 frames + 80ms: garantiza que el navegador pintó opacity:0
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          setTimeout(function () {
            if (!cancelled) setInView(true);
          }, 80);
        });
      });
    };

    const obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          trigger();
          obs.disconnect();
        }
      });
    }, { threshold: th }); // sin rootMargin negativo

    obs.observe(el);
    return function () {
      cancelled = true;
      obs.disconnect();
    };
  }, [th]);

  return [ref, inView];
}

/* ============ SAFE IMAGE ============ */
function SafeImage({ src, alt, className, style, decorative }) {
  const [failed, setFailed] = useState(false);
  useEffect(() => { setFailed(false); }, [src]);

  if (!src) return null;
  if (failed && decorative) return null;
  if (failed) {
    return <div className={className} style={Object.assign({}, style, { backgroundColor: 'oklch(0.18 0 0)' })} aria-hidden="true" />;
  }
  return (
    <img
      src={src}
      alt={decorative ? '' : (alt || '')}
      className={className}
      style={style}
      onError={function () { setFailed(true); }}
      aria-hidden={decorative ? 'true' : undefined}
    />
  );
}

/* ============ NEBULOSA ============ */
function rand(a, b) { return a + Math.random() * (b - a); }

function StarField(props) {
  const count = props.count || 300;
  const ring = props.ring || false;

  const canvasRef = useRef(null);
  const stateRef = useRef({ particles: [], blobs: [] });
  const rafRef = useRef(0);
  const sizeRef = useRef({ w: 0, h: 0 });

  useEffect(function () {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const parent = canvas.parentElement;
    if (!parent) return;

    const build = function (w, h) {
      // --- Blobs de nebulosa (manchas de luz muy difusas) ---
      const blobs = [];
      const blobCount = 4;
      for (let i = 0; i < blobCount; i++) {
        // Primera = lima (acento de marca), segunda = azulada, resto = blancas
        let hue;
        if (i === 0) hue = 'lime';
        else if (i === 1) hue = 'blue';
        else hue = 'white';

        blobs.push({
          x: rand(0, w),
          y: rand(0, h),
          r: 220 + Math.random() * 280,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          hue: hue,
          opacity: 0.025 + Math.random() * 0.03,
        });
      }

      // --- Partículas pequeñas sobre la nebulosa ---
      const particles = [];
      const particleCount = Math.min(count, Math.floor((w * h) / 8000));
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: 0.3 + Math.random() * 0.9,
          vy: -(0.02 + Math.random() * 0.1),
          vx: (Math.random() - 0.5) * 0.04,
          baseOpacity: 0.1 + Math.random() * 0.4,
          pulseOffset: Math.random() * Math.PI * 2,
          pulseSpeed: 0.2 + Math.random() * 0.6,
        });
      }

      stateRef.current = { particles: particles, blobs: blobs };
    };

    const resize = function () {
      const rect = parent.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      sizeRef.current = { w: rect.width, h: rect.height };
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      const ctx = canvas.getContext('2d');
      if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build(rect.width, rect.height);
    };

    const ro = new ResizeObserver(resize);
    ro.observe(parent);
    resize();

    const draw = function (t) {
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const s = sizeRef.current;
      const w = s.w, h = s.h;
      ctx.clearRect(0, 0, w, h);

      const { particles, blobs } = stateRef.current;

      // --- Dibujar blobs (nebulosa) ---
      for (let i = 0; i < blobs.length; i++) {
        const b = blobs[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < -b.r) b.x = w + b.r;
        if (b.x > w + b.r) b.x = -b.r;
        if (b.y < -b.r) b.y = h + b.r;
        if (b.y > h + b.r) b.y = -b.r;

        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        let color;
        if (b.hue === 'lime') color = 'rgba(180,255,120,' + b.opacity + ')';
        else if (b.hue === 'blue') color = 'rgba(120,180,255,' + b.opacity + ')';
        else color = 'rgba(255,255,255,' + b.opacity + ')';
        grad.addColorStop(0, color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // --- Dibujar partículas pequeñas encima ---
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;

        const pulse = 0.5 + 0.5 * Math.sin(t * 0.001 * p.pulseSpeed + p.pulseOffset);
        const alpha = p.baseOpacity * (0.4 + 0.6 * pulse);

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.fill();
      }

      // --- Anillo suave si se pide (para Portfolio) ---
      if (ring && w > 0 && h > 0) {
        const ringR = Math.min(w, h) * 0.37;
        const bandW = 50;
        const inner = Math.max(0, ringR - bandW * 4);
        const outer = ringR + bandW * 4;
        if (outer > 0) {
          const grad = ctx.createRadialGradient(w / 2, h / 2, inner, w / 2, h / 2, outer);
          grad.addColorStop(0, 'rgba(180,255,120,0.02)');
          grad.addColorStop(0.5, 'rgba(180,255,120,0.035)');
          grad.addColorStop(0.58, 'rgba(255,255,255,0.02)');
          grad.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }
      }

      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);

    return function () {
      cancelAnimationFrame(rafRef.current);
      ro.disconnect();
    };
  }, [count, ring]);

    return (
    <canvas 
      ref={canvasRef} 
      className="absolute pointer-events-none" 
      style={{ 
        zIndex: 0,
        top: '-30%',
        height: '160%',
        width: '100%'
      }} 
      aria-hidden="true" 
    />
  );
}

/* ============ LÍNEAS CURVAS (TRAZOS DE LUZ) ============ */
function LineField({ variant }) {
  const v = variant || 'hero';

  // Cada sección tiene su propia configuración de curvas
  // Nota: 'marvelsBottom' ya no se usa, pero se deja por compatibilidad
  const CONFIGS = {
    hero:         { count: 7, opacity: 0.10, speed: 1.0, lime: 1 },
    photographer: { count: 5, opacity: 0.08, speed: 0.8, lime: 1 },
    projects:     { count: 6, opacity: 0.09, speed: 0.9, lime: 1 },
    marvels:      { count: 5, opacity: 0.10, speed: 0.8, lime: 1 },
    marvelsBottom:{ count: 4, opacity: 0.08, speed: 0.7, lime: 0 },
  };
  const cfg = CONFIGS[v] || CONFIGS.hero;

  const svgRef = useRef(null);
  const curvesRef = useRef([]);
  const rafRef = useRef(0);

  useEffect(function () {
    const svg = svgRef.current;
    if (!svg) return;

    // Filtro de glow para los destellos
    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    filter.setAttribute('id', 'lineGlow-' + v);
    filter.setAttribute('x', '-50%');
    filter.setAttribute('y', '-50%');
    filter.setAttribute('width', '200%');
    filter.setAttribute('height', '200%');
    const blur = document.createElementNS('http://www.w3.org/2000/svg', 'feGaussianBlur');
    blur.setAttribute('stdDeviation', '3');
    filter.appendChild(blur);
    defs.appendChild(filter);
    svg.appendChild(defs);

    // Crear las curvas
    const curves = [];
    for (let i = 0; i < cfg.count; i++) {
      const startY = 100 + Math.random() * 800;
      const endY = 100 + Math.random() * 800;
      const midY = (startY + endY) / 2 + (Math.random() - 0.5) * 300;
      const isLime = i < cfg.lime;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', 'M -100 ' + startY + ' Q 400 ' + midY + ' 500 ' + ((startY + endY) / 2) + ' T 1100 ' + endY);
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', isLime
        ? 'rgba(180,255,120,' + (cfg.opacity * 1.4) + ')'
        : 'rgba(255,255,255,' + cfg.opacity + ')');
      path.setAttribute('stroke-width', '1');
      svg.appendChild(path);

      // Punto de luz que viaja
      const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('cx', '-100');
      dot.setAttribute('cy', startY);
      dot.setAttribute('r', isLime ? '2.5' : '2');
      dot.setAttribute('fill', isLime ? 'rgba(180,255,120,1)' : 'rgba(255,255,255,1)');
      dot.setAttribute('filter', 'url(#lineGlow-' + v + ')');
      svg.appendChild(dot);

      curves.push({
        path: path,
        dot: dot,
        startY: startY,
        endY: endY,
        midY: midY,
        phase: Math.random(),
        speed: (0.00006 + Math.random() * 0.00006) * cfg.speed,
        isLime: isLime,
      });
    }
    curvesRef.current = curves;

    const draw = function (t) {
      for (let i = 0; i < curves.length; i++) {
        const c = curves[i];
        const progress = ((t * c.speed + c.phase) % 1);
        const x = -100 + progress * 1200;
        const p = progress;
        const y = (1 - p) * (1 - p) * c.startY + 2 * (1 - p) * p * c.midY + p * p * c.endY;
        c.dot.setAttribute('cx', x);
        c.dot.setAttribute('cy', y);
      }
      rafRef.current = requestAnimationFrame(draw);
    };
    rafRef.current = requestAnimationFrame(draw);

    return function () {
      cancelAnimationFrame(rafRef.current);
      while (svg.firstChild) svg.removeChild(svg.firstChild);
    };
  }, [v, cfg.count, cfg.opacity, cfg.speed, cfg.lime]);

  return (
    <svg
      ref={svgRef}
      className="absolute inset-0 pointer-events-none select-none w-full h-full"
      viewBox="0 0 1000 1000"
      preserveAspectRatio="xMidYMid slice"
      style={{ zIndex: 0 }}
      aria-hidden="true"
    />
  );
}

/* ============ INTRO ============ */
function IntroSequence({ onDone }) {
  const [hidden, setHidden] = useState(false);
  const [phase, setPhase] = useState(0);

  useEffect(function () {
    const t1 = setTimeout(function () { setPhase(1); }, 300);
    const t2 = setTimeout(function () { setPhase(2); }, 1600);
    const t3 = setTimeout(function () { setPhase(3); }, 3000);
    const t4 = setTimeout(function () {
      setHidden(true);
      if (onDone) onDone();
    }, 3900);
    return function () { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); };
  }, [onDone]);

  if (hidden) return null;

  const fadeBg = phase >= 3;

  return (
    <div className="fixed inset-0 z-[100] pointer-events-none flex items-center justify-center">
      <div
        className="absolute inset-0 transition-opacity duration-[800ms]"
        style={{ backgroundColor: '#0a0a0a', opacity: fadeBg ? 0 : 1 }}
      />

      {/* Círculos concéntricos */}
      {[1, 2, 3].map(function (n) {
        const size = 260 * n;
        const visible = phase >= 1 && phase < 3;
        return (
          <div
            key={n}
            className="absolute left-1/2 top-1/2 rounded-full border border-white/10 transition-all duration-[2400ms] ease-out"
            style={{
              width: size, height: size,
              marginLeft: -size / 2, marginTop: -size / 2,
              opacity: visible ? 0.55 : 0,
              transform: phase >= 2 ? 'scale(1.4)' : (phase >= 1 ? 'scale(1)' : 'scale(0.15)'),
              transitionDelay: ((n - 1) * 120) + 'ms',
            }}
          />
        );
      })}

      {/* 🔧 FIX #1 — Logo DENTRO del círculo, visible todo el tiempo */}
      <div
        className="relative transition-all duration-[1000ms]"
        style={{
          opacity: phase >= 3 ? 0 : 1,
          transform: phase >= 2 ? 'scale(1)' : 'scale(0.9)',
          transitionTimingFunction: 'cubic-bezier(0.22,1,0.36,1)',
        }}
      >
        <img
          src={ASSETS.logo}
          alt={BRAND}
          className="h-24 md:h-32 w-auto object-contain"
          style={{ filter: 'drop-shadow(0 0 40px rgba(255,255,255,0.15))' }}
        />
      </div>

      {/* 🔧 FIX #1 — Logo que vuela hacia el menú de navegación (mismo LOGO_AJ_1) */}
      <div
        className="absolute transition-all duration-[900ms]"
        style={{
          top: phase >= 3 ? '24px' : '50%',
          left: phase >= 3 ? '24px' : '50%',
          transform: phase >= 3
            ? 'translate(0, 0) scale(0.42)'
            : 'translate(-50%, -50%) scale(0.8)',
          transformOrigin: 'top left',
          opacity: phase >= 3 ? 1 : 0,
          transitionTimingFunction: 'cubic-bezier(0.22,1,0.36,1)',
        }}
      >
        <img
          src={ASSETS.logo}
          alt={BRAND}
          className="h-24 md:h-32 w-auto object-contain"
        />
      </div>
    </div>
  );
}

function Reveal({ children, delay, className, photo }) {
  const [ref, inView] = useInView();
  const d = delay || 0;
  const base = photo ? 'anim-photo' : 'anim-base';
  return (
    <div
      ref={ref}
      className={(className || '') + ' ' + base + (inView ? ' anim-in' : '')}
      style={{ transitionDelay: (inView ? d : 0) + 'ms' }}
    >
      {children}
    </div>
  );
}

                    alt={p.alt}
                    className="w-full aspect-[3/4] object-cover grayscale hover:grayscale-0 transition-all duration-[900ms] ease-out group-hover:scale-110"
                  />
                </div>
                <div className="text-center space-y-3 mt-4">
                  <h3 className="font-display font-bold text-sm uppercase tracking-wider text-white">{p.alt}</h3>
                  <span className="inline-flex items-center gap-2 text-xs text-white/60 border border-white/15 rounded-full px-3 py-1.5 group-hover:bg-white/5 transition">
                    ver más

    {activeGallery && (

    )}
  </section>
);  
}

function ContactSection() {

      const section = sectionRef.current;
      const bg = bgRef.current;
      if (!section || !bg) return;
      const rect = section.getBoundingClientRect();
      const vh = window.innerHeight;
      const total = rect.height + vh;
      const passed = vh - rect.top;
      const progress = Math.max(0, Math.min(1, passed / total));
      bg.style.transform = 'translateY(' + (-15 * progress) + '%)';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return function () { window.removeEventListener('scroll', onScroll); };
  }, []);

            </a>
          </div>
        </div>
      </div>

      <div className="relative min-h-[80vh] overflow-hidden">
        <div ref={bgRef} className="absolute inset-0 -top-[10%] -bottom-[10%]" style={{ willChange: 'transform' }}>
          <SafeImage src={ASSETS.contactBg} alt="" decorative className="w-full h-full object-cover" />

              <h3 className="font-display font-black uppercase text-4xl md:text-6xl leading-[1] tracking-tight">

            </Reveal>

<Reveal delay={150}>

  </p>
</Reveal>

            <div className="flex items-center justify-center gap-1">

/* ============ LIGHTBOX (visor de foto ampliada) ============ */
function Lightbox({ images, index, onClose, onPrev, onNext }) {
  useEffect(function () {
    const onKey = function (e) {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowLeft') onPrev();
      if (e.key === 'ArrowRight') onNext();
    };
    document.body.style.overflow = 'hidden';
    window.addEventListener('keydown', onKey);
    return function () {
      document.body.style.overflow = '';
      window.removeEventListener('keydown', onKey);
    };
  }, [onClose, onPrev, onNext]);

  return (
    <div
      className="fixed inset-0 z-[200] bg-black/95 backdrop-blur-md flex items-center justify-center"
      onClick={onClose}
    >
      <button
        onClick={onClose}
        aria-label="Cerrar"
        className="absolute top-6 right-6 z-10 grid place-items-center w-11 h-11 rounded-full border border-white/20 text-white/80 hover:text-white hover:bg-white/10 transition"
      >
        <IconClose className="w-5 h-5" />
      </button>

      <button
        onClick={function (e) { e.stopPropagation(); onPrev(); }}
        aria-label="Anterior"
        className="absolute left-4 md:left-8 z-10 grid place-items-center w-12 h-12 rounded-full border border-white/20 text-white/80 hover:text-white hover:bg-white/10 transition"
      >
        <IconMoveRight className="w-5 h-5" style={{ transform: 'rotate(180deg)' }} />
      </button>

      <button
        onClick={function (e) { e.stopPropagation(); onNext(); }}
        aria-label="Siguiente"
        className="absolute right-4 md:right-8 z-10 grid place-items-center w-12 h-12 rounded-full border border-white/20 text-white/80 hover:text-white hover:bg-white/10 transition"
      >
        <IconMoveRight className="w-5 h-5" />
      </button>

      <div
        className="max-w-[92vw] max-h-[88vh] relative"
        onClick={function (e) { e.stopPropagation(); }}
      >
        <img
          src={images[index]}
          alt={'Foto ' + (index + 1)}
          className="max-w-[92vw] max-h-[88vh] object-contain select-none"
          style={{ animation: 'lbFade 400ms cubic-bezier(0.22,1,0.36,1)' }}
        />
        <div className="absolute -bottom-10 left-1/2 -translate-x-1/2 text-white/60 text-xs uppercase tracking-[0.3em]">
          {index + 1} / {images.length}
        </div>
      </div>

      <style>{`
        @keyframes lbFade { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
      `}</style>
    </div>
  );
}

/* ============ GALLERY MODAL (ventana de categoría) ============ */
function GalleryModal({ folder, onClose }) {
  const images = GALLERIES[folder] || [];
  const title = GALLERY_TITLES[folder] || folder;
  const [lbIndex, setLbIndex] = useState(-1);

  useEffect(function () {
    document.body.style.overflow = 'hidden';
    const onKey = function (e) { if (e.key === 'Escape' && lbIndex < 0) onClose(); };
    window.addEventListener('keydown', onKey);
    return function () {
      document.body.style.overflow = '';
      window.removeEventListener('keydown', onKey);
    };
  }, [onClose, lbIndex]);

  return (
    <div className="fixed inset-0 z-[150] bg-[#0a0a0a]/98 backdrop-blur-xl overflow-y-auto gallery-scroll">
      <div className="sticky top-0 z-20 backdrop-blur-xl bg-[#0a0a0a]/85 border-b border-white/10">
        <div className="max-w-7xl mx-auto px-6 md:px-10 py-5 flex items-center justify-between gap-4">
          <div>
            <p className="text-white/40 text-[10px] uppercase tracking-[0.35em] mb-1">Portafolio</p>
            <h2 className="font-display font-black text-4xl sm:text-5xl md:text-6xl uppercase leading-[0.95]">              {title}
            </h2>
          </div>
          <button
            onClick={onClose}
            aria-label="Cerrar galería"
            className="grid place-items-center w-11 h-11 rounded-full border border-white/20 text-white/80 hover:text-white hover:bg-white/10 transition shrink-0"
          >
            <IconClose className="w-5 h-5" />
          </button>
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-6 md:px-10 py-14">
        <div className="columns-1 sm:columns-2 lg:columns-3 gap-5 [column-fill:_balance]">
          {images.map(function (src, i) {
            return (
              <div
                key={i}
                className="gallery-item mb-5 break-inside-avoid"
                style={{ animationDelay: (i * 60) + 'ms' }}
                onClick={function () { setLbIndex(i); }}
              >
                <div className="group relative overflow-hidden ring-1 ring-white/10 cursor-zoom-in">
                  <SafeImage
                    src={src}
                    alt={title + ' ' + (i + 1)}
                    className="w-full h-auto object-cover transition-transform duration-[1400ms] ease-out group-hover:scale-105"
                    style={{ willChange: 'transform' }}
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none" />
                  <div className="absolute bottom-3 right-3 text-[10px] text-white/70 opacity-0 group-hover:opacity-100 transition-opacity duration-300 uppercase tracking-widest">
                    {i + 1}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {images.length === 0 && (
          <p className="text-white/40 text-center py-20 text-sm">
            No hay fotos todavía en esta categoría.
          </p>
        )}

        <div className="flex justify-center mt-16">
          <button
            onClick={onClose}
            className="inline-flex items-center gap-2 rounded-full border border-white/20 px-6 py-3 text-xs uppercase tracking-widest text-white/70 hover:text-white hover:bg-white/5 transition"
          >
            ← Volver al portafolio
          </button>
        </div>
      </div>

      {lbIndex >= 0 && (
        <Lightbox
          images={images}
          index={lbIndex}
          onClose={function () { setLbIndex(-1); }}
          onPrev={function () { setLbIndex(function (v) { return (v - 1 + images.length) % images.length; }); }}
          onNext={function () { setLbIndex(function (v) { return (v + 1) % images.length; }); }}
        />
      )}
    </div>
  );
}
